<script>
const P = JSON.parse(document.getElementById('payload').textContent);
function b64(s){ const bin=atob(s); const n=bin.length; const u=new Uint8Array(n); for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i); return u; }
const f = document.getElementById('f'), pw = document.getElementById('pw'),
      btn = document.getElementById('btn'), err = document.getElementById('err');

// 브라우저 지원 검사(압축 해제 + 암호화). 미지원이면 입력을 막고 안내한다.
const supported = (typeof DecompressionStream !== 'undefined') && !!(window.crypto && crypto.subtle && crypto.subtle.decrypt);
if (!supported) {
  pw.disabled = true; btn.disabled = true;
  err.textContent = '이 브라우저에서는 대시보드를 열 수 없습니다. PC의 Chrome 또는 Microsoft Edge 최신 버전으로 접속해 주세요.';
}

async function gunzip(buf){
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).arrayBuffer();
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!supported) return;
  err.textContent=''; btn.disabled=true; btn.textContent='복호화 중...';
  // 1) 복호화 (실패 = 비밀번호 오류)
  let ptBuf;
  try{
    const enc=new TextEncoder();
    const baseKey=await crypto.subtle.importKey('raw',enc.encode(pw.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},
      baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
    ptBuf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  }catch(_){
    btn.disabled=false; btn.textContent='열기';
    err.textContent='비밀번호가 올바르지 않습니다.';
    return;
  }
  // 2) 압축 해제 후 표시 (실패 = 브라우저/데이터 오류)
  try{
    const htmlBuf = P.gz ? await gunzip(ptBuf) : ptBuf;
    const html = new TextDecoder('utf-8').decode(htmlBuf);
    // iframe(blob:) 대신 페이지를 직접 교체 — 카톡 등 인앱 브라우저는 blob: iframe을 막는다
    document.open('text/html','replace');
    document.write(html);
    document.close();
  }catch(_){
    btn.disabled=false; btn.textContent='열기';
    err.textContent='대시보드를 여는 중 오류가 발생했습니다. PC의 Chrome 또는 Edge 최신 버전에서 다시 시도해 주세요.';
  }
});
</script>
</body>
</html>
